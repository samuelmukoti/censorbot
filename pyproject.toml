[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "censorbot"
version = "0.1.0"
description = "Remove profanity from film dialogue cleanly: voice-only cuts, precise word timing"
readme = "README.md"
authors = [
    {name = "Samuel Mukoti", email = "contact@samuelmukoti.com"}
]
license = {text = "GPL-3.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["video", "censoring", "profanity", "subtitles", "whisper", "ai", "transcription"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",       # wav2vec2 forced alignment
    "faster-whisper>=1.0.0",   # CUDA / CPU speech recognition
    "pysrt>=1.1.2",
    "chardet>=5.0.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0.0",
    # Metal acceleration on Apple Silicon
    "mlx-whisper>=0.4.0; platform_system=='Darwin' and platform_machine=='arm64'",
]

[project.optional-dependencies]
# Voice-only cuts on stereo sources (5.1 sources need nothing extra).
separation = ["demucs>=4.0.0"]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/samuelmukoti/censorbot"
Documentation = "https://github.com/samuelmukoti/censorbot#readme"
Repository = "https://github.com/samuelmukoti/censorbot"
"Bug Reports" = "https://github.com/samuelmukoti/censorbot/issues"

[project.scripts]
censorbot = "censorbot.cli:main"

[tool.setuptools]
packages = ["censorbot"]
py-modules = ["censor"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-m 'not slow'"
markers = ["slow: end-to-end tests that need FFmpeg, Whisper models and macOS say"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
